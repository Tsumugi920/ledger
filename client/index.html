<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ledger 记账本</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <h1>📒 ledger 记账本</h1>
      <button id="btn-add" class="btn btn-primary" type="button">＋ 记一笔</button>
    </div>
  </header>

  <main class="container">
    <section class="card filters" aria-label="筛选">
      <div class="filter-item">
        <label for="filter-month">月份</label>
        <select id="filter-month">
          <option value="">全部月份</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="filter-category">分类</label>
        <select id="filter-category">
          <option value="">全部分类</option>
        </select>
      </div>
      <div class="filter-item">
        <label for="filter-type">类型</label>
        <select id="filter-type">
          <option value="">全部类型</option>
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
      </div>
      <button id="btn-reset" class="btn" type="button">重置筛选</button>
    </section>

    <section class="stats" aria-label="统计">
      <div class="card stat">
        <span class="stat-label">收入</span>
        <strong id="stat-income" class="stat-value income">¥0.00</strong>
      </div>
      <div class="card stat">
        <span class="stat-label">支出</span>
        <strong id="stat-expense" class="stat-value expense">¥0.00</strong>
      </div>
      <div class="card stat">
        <span class="stat-label">结余</span>
        <strong id="stat-balance" class="stat-value">¥0.00</strong>
      </div>
      <div class="card stat">
        <span class="stat-label">账单笔数</span>
        <strong id="stat-count" class="stat-value">0</strong>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>账单列表</h2>
        <span id="list-hint" class="muted"></span>
      </div>
      <div class="table-wrap">
        <table id="bill-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>类型</th>
              <th>分类</th>
              <th class="num">金额</th>
              <th>备注</th>
              <th class="ops">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="bill-empty" class="empty hidden">没有符合条件的账单，试试调整筛选或记一笔。</p>
      </div>
    </section>

    <div class="grid-2">
      <section class="card">
        <h2>月度收支统计</h2>
        <div class="table-wrap">
          <table id="month-table">
            <thead>
              <tr>
                <th>月份</th>
                <th class="num">收入</th>
                <th class="num">支出</th>
                <th class="num">结余</th>
                <th class="num">笔数</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p id="month-empty" class="empty hidden">暂无数据</p>
        </div>
      </section>

      <section class="card">
        <h2>分类汇总</h2>
        <div class="table-wrap">
          <table id="category-table">
            <thead>
              <tr>
                <th>分类</th>
                <th class="num">收入</th>
                <th class="num">支出</th>
                <th class="num">笔数</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p id="category-empty" class="empty hidden">暂无数据</p>
        </div>
      </section>
    </div>
  </main>

  <div id="modal-mask" class="modal-mask hidden">
    <form id="bill-form" class="modal card" novalidate>
      <h2 id="form-title">记一笔</h2>
      <div class="form-grid">
        <div class="form-item">
          <label for="form-type">类型</label>
          <select id="form-type">
            <option value="expense">支出</option>
            <option value="income">收入</option>
          </select>
        </div>
        <div class="form-item">
          <label for="form-category">分类</label>
          <select id="form-category"></select>
        </div>
        <div class="form-item">
          <label for="form-amount">金额（元）</label>
          <input id="form-amount" type="number" step="0.01" min="0" placeholder="0.00" required />
        </div>
        <div class="form-item">
          <label for="form-date">日期</label>
          <input id="form-date" type="date" required />
        </div>
        <div class="form-item form-item-wide">
          <label for="form-note">备注</label>
          <input id="form-note" type="text" maxlength="50" placeholder="选填" />
        </div>
      </div>
      <p id="form-error" class="form-error hidden"></p>
      <div class="form-actions">
        <button type="button" id="btn-cancel" class="btn">取消</button>
        <button type="submit" id="btn-save" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
